<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matricular Estudante</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-admin">
        
        <!-- MENU LATERAL -->
        <aside class="menu-lateral">
            <div class="menu-cabecalho">
                <i class="fa-solid fa-school"></i>
                <h2>Sistema IFB</h2>
                <p>Manejo Inclusivo</p>
            </div>
            
            <ul class="menu-links">
                <!-- Mantemos a área de turmas ativa no menu -->
                <li><a href="turma.html" class="ativo"><i class="fa-solid fa-users-viewfinder"></i> Painel e Consultas</a></li>
                <li><a href="cadastrar-turma.html"><i class="fa-solid fa-folder-plus"></i> Cadastrar Turma</a></li>
            </ul>

            <div class="menu-rodape">
                <a href="#" id="btn-sair" class="btn-deslogar">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair do Sistema
                </a>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL (DIREITA) -->
        <main class="conteudo-principal">
            
            <a href="lista-alunos.html" class="link-voltar margem-inferior">
                <i class="fa-solid fa-arrow-left"></i> Voltar para a Turma
            </a>

            <div class="cabecalho-cadastro">
                <h1 class="titulo-painel">Matricular Novo Estudante</h1>
                <p class="subtitulo">Os dados preenchidos serão vinculados automaticamente à turma selecionada.</p>
            </div>

            <div class="caixa-formulario">
                <form id="form-cadastro">
                    <div class="grupo-input">
                        <label class="rotulo">Nome Completo do Estudante</label>
                        <div class="input-com-icone">
                            <i class="fa-solid fa-user icone-input"></i>
                            <input type="text" id="nome-aluno" placeholder="Ex: João Silva" required>
                        </div>
                    </div>

                    <div class="grupo-input">
                        <label class="rotulo">Matrícula (Opcional)</label>
                        <div class="input-com-icone">
                            <i class="fa-solid fa-id-card icone-input"></i>
                            <input type="text" id="matricula-aluno" placeholder="Ex: 2023101234">
                        </div>
                    </div>

                    <div class="grupo-input">
                        <label class="rotulo">Neurodivergência / Condição</label>
                        <div class="input-com-icone">
                            <i class="fa-solid fa-brain icone-input"></i>
                            <input type="text" id="neuro-aluno" placeholder="Ex: TDAH, TOD, TEA" required>
                        </div>
                    </div>

                    <div class="grupo-input">
                        <label class="rotulo">E-mail do Familiar (Opcional)</label>
                        <div class="input-com-icone">
                            <i class="fa-solid fa-envelope icone-input"></i>
                            <input type="email" id="email-familiar" placeholder="Para acompanhamento familiar">
                        </div>
                    </div>

                    <button type="submit" id="btn-salvar" class="btn-nova-ocorrencia btn-largo">
                        <i class="fa-solid fa-check"></i> Salvar Cadastro
                    </button>
                </form>
            </div>

        </main>
    </div>

    <script type="module" src="cadastro-aluno.js"></script>
</body>
</html>
