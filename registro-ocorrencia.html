<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Registro - Sistema de Manejo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo-painel">

    <div class="painel-container">
        
        <div class="cabecalho-cadastro">
            <a href="perfil-aluno.html" class="link-voltar">
                <i class="fa-solid fa-arrow-left"></i> Cancelar e Voltar
            </a>
            <h1 class="titulo-painel">Novo Registro</h1>
            <p class="subtitulo" id="nome-aluno-registro" style="color: #6B9BD1; font-weight: 600;">Carregando aluno...</p>
        </div>

        <div class="caixa-formulario">
            <form id="form-ocorrencia">
                
                <div class="grupo-input">
                    <label class="rotulo">Comportamentos Observados</label>
                    <div class="container-chips" id="chips-comportamento">
                        <button type="button" class="chip" data-valor="Agitação">Agitação</button>
                        <button type="button" class="chip" data-valor="Desatenção">Desatenção</button>
                        <button type="button" class="chip" data-valor="Conflito">Conflito</button>
                        <button type="button" class="chip" data-valor="Impulsividade">Impulsividade</button>
                        <button type="button" class="chip" data-valor="Frustração">Frustração</button>
                        <button type="button" class="chip" data-valor="Desafio">Desafio</button>
                    </div>
                </div>

                <div class="grupo-input" style="margin-top: 25px;">
                    <label class="rotulo">Intensidade</label>
                    <div class="container-chips" id="chips-intensidade">
                        <button type="button" class="chip" data-valor="Leve">Leve</button>
                        <button type="button" class="chip" data-valor="Moderada">Moderada</button>
                        <button type="button" class="chip" data-valor="Alta">Alta</button>
                    </div>
                </div>

                <div class="grupo-input" style="margin-top: 25px;">
                    <label class="rotulo">Observações (opcional)</label>
                    <textarea id="obs-ocorrencia" rows="3" placeholder="Adicione detalhes sobre o contexto ou situação..." class="input-area"></textarea>
                </div>

                <button type="submit" class="btn-nova-ocorrencia btn-largo" style="margin-top: 30px;">
                    Salvar e Ver Sugestões
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>
        </div>

    </div>

    <script type="module" src="registro-ocorrencia.js"></script>
</body>
</html>
