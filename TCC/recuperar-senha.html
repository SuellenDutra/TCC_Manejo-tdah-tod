<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <img src="Figuras/Logo1.png" alt="Logo" class="logo">
        
        <h1 class="titulo">Recuperar Acesso</h1>
        <p class="subtitulo">Enviaremos um link de recuperação para o seu e-mail.</p>

        <form class="formulario" action="index.html">
            <div class="grupo-input">
                <i class="fa-regular fa-envelope icone-input"></i>
                <input type="email" placeholder="Digite seu e-mail cadastrado" required>
            </div>

            <button type="submit" class="btn-entrar btn-espaco">
                Enviar Link
            </button>
        </form>

        <div class="texto-cadastro">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar para o Login</a>
        </div>
    </div>

</body>
</html>
