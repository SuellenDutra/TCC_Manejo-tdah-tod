<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Inicial - Manejo Inclusivo</title>
    
    <!-- TRAVA DE SEGURANÇA IMEDIATA (Evita o piscar da tela) -->
    <script>
        if (localStorage.getItem('perfilLogado') !== 'Educador') {
            window.location.replace('index.html');
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-admin">
        
        <!-- MENU LATERAL -->
        <aside class="menu-lateral">
            <div class="menu-cabecalho">
                <i class="fa-solid fa-school"></i>
                <h2>Sistema IFB</h2>
                <p>Manejo Inclusivo</p>
            </div>
            
            <ul class="menu-links">
                <li><a href="turma.html" class="ativo"><i class="fa-solid fa-users-viewfinder"></i> Painel e Consultas</a></li>
                <li><a href="cadastrar-turma.html"><i class="fa-solid fa-folder-plus"></i> Cadastrar Turma</a></li>
            </ul>

            <div class="menu-rodape">
                <a href="#" id="btn-sair" class="btn-deslogar">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair do Sistema
                </a>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="conteudo-principal">
            
            <div class="painel-container painel-transparente">
                
                <a href="lista-alunos.html" class="link-voltar margem-inferior">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para a Turma
                </a>

               <div class="cabecalho-painel cabecalho-em-linha">
                    
                    <div>
                        <h1 class="titulo-painel" id="nome-aluno-titulo">Carregando...</h1>
                        <p class="subtitulo info-matricula" id="matricula-aluno-texto">Matrícula: ...</p>
                        <p class="neuro-destaque info-diagnostico" id="neuro-aluno-texto">Diagnóstico: ...</p>
                    </div>
                    
                    <div class="botoes-acao grupo-botoes-topo">
                        <a href="registro-ocorrencia.html" class="btn-nova-ocorrencia">
                            <i class="fa-solid fa-plus"></i> Registrar Ocorrência
                        </a>
                        
                         <button id="btn-gerar-relatorio" class="btn-secundario">
                            <i class="fa-solid fa-file-pdf"></i> Gerar Relatório
                        </button>

                        <button id="btn-abrir-realocacao" class="btn-secundario">
                            <i class="fa-solid fa-people-arrows"></i> Mudar de Turma
                        </button>

                        <button id="btn-excluir-aluno" class="btn-secundario btn-perigo">
                            <i class="fa-solid fa-user-xmark"></i> Excluir Aluno
                        </button>
                    </div>
                </div>

                <!-- CAIXA OCULTA PARA TRANSFERIR O ALUNO DE TURMA -->
                <div id="caixa-realocacao" class="painel-filtros caixa-transferencia oculto">
                    <div class="cabecalho-em-linha">
                        <div class="campo-filtro">
                            <label class="rotulo-filtro" for="select-nova-turma">Transferir estudante para a turma:</label>
                            <select id="select-nova-turma" class="input-filtro">
                                <option value="">Carregando turmas...</option>
                            </select>
                        </div>
                        
                        <div class="grupo-botoes-topo">
                            <button id="btn-confirmar-realocacao" class="btn-nova-ocorrencia">
                                <i class="fa-solid fa-check"></i> Confirmar
                            </button>
                            <button id="btn-cancelar-realocacao" class="btn-secundario">
                                Cancelar
                            </button>
                        </div>
                    </div>
                </div>

                <h2 class="titulo-historico" style="margin-top: 30px; margin-bottom: 20px;">
                    <i class="fa-solid fa-list-ul"></i> Histórico Recente
                </h2>
                
                <div id="container-timeline">
                    <!-- O JavaScript preenche o histórico aqui -->
                </div>

            </div>

        </main>
    </div>

    <script type="module" src="perfil-aluno.js"></script>

</body>
</html>
